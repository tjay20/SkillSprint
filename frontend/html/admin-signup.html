<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSprint - Admin Sign Up</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/ux-foundation.css">
</head>

<body>
  <div class="cursor-glow"></div>


  <div class="login-card">
    <h1 class="terminal-title">
      <svg viewBox="-11.5 -10.23174 23 20.46348" class="logo-react">
        <circle cx="0" cy="0" r="2.05" class="react-core" />
        <g fill="none" class="react-orbits">
          <ellipse rx="11" ry="4.2" />
          <ellipse rx="11" ry="4.2" transform="rotate(60)" />
          <ellipse rx="11" ry="4.2" transform="rotate(120)" />
        </g>
        <circle r="0.8" class="electron">
          <animateMotion dur="3s" repeatCount="indefinite" path="M-11,0a11,4.2 0 1,0 22,0a11,4.2 0 1,0 -22,0" />
        </circle>
      </svg>
      Skill<span>Sprint</span><span class="cursor">_</span>
    </h1>
    <p class="subtitle">Create your admin account</p>

    <div id="generalError" class="error-message" role="alert" aria-live="assertive"></div>
    <p id="adminSignupStatus" class="helper-text" role="status" aria-live="polite">Create an admin account with strong
      credentials.</p>

    <form id="adminSignupForm">
      <div class="input-group">
        <input type="text" id="name" name="name" required placeholder="Admin Name" autocomplete="name" />
        <span class="error-message" id="nameError"></span>
      </div>

      <div class="input-group">
        <input type="email" id="email" name="email" required placeholder="Admin Email" autocomplete="email" />
        <span class="error-message" id="emailError"></span>
      </div>

      <div class="input-group password">
        <input type="password" id="password" name="password" required placeholder="Password" autocomplete="new-password"
          aria-describedby="adminPasswordHelp" />
        <span id="togglePassword">👁</span>
        <span class="error-message" id="passwordError"></span>
      </div>
      <p id="adminPasswordHelp" class="helper-text">Use at least 6 characters. Prefer a longer passphrase.</p>

      <div class="input-group password">
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm Password"
          autocomplete="new-password" />
        <span id="toggleConfirmPassword">👁</span>
        <span class="error-message" id="confirmPasswordError"></span>
      </div>

      <button type="submit" id="signupBtn">
        <span>CREATE ADMIN</span>
      </button>
    </form>

    <p class="footer-text">
      Already admin?
      <a href="admin-login.html">Admin Log in</a>
    </p>

    <p class="footer-text">
      Student signup?
      <a href="signup.html">Go to student sign up</a>
    </p>
  </div>

  <script src="../js/api-base.js"></script>
  <script src="../js/admin-signup.js"></script>
  <script src="../js/ux-foundation.js"></script>
</body>

</html>
