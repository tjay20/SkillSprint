<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSprint | Admin Login</title>
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/ux-foundation.css">
</head>
<body>
  <div class="cursor-glow"></div>


  <div class="login-card">
    <h1 class="terminal-title">
      <svg viewBox="-11.5 -10.23174 23 20.46348" class="logo-react">
        <circle cx="0" cy="0" r="2.05" class="react-core" />
        <g fill="none" class="react-orbits">
          <ellipse rx="11" ry="4.2" />
          <ellipse rx="11" ry="4.2" transform="rotate(60)" />
          <ellipse rx="11" ry="4.2" transform="rotate(120)" />
        </g>
        <circle r="0.8" class="electron">
          <animateMotion dur="3s" repeatCount="indefinite" path="M-11,0a11,4.2 0 1,0 22,0a11,4.2 0 1,0 -22,0" />
        </circle>
      </svg>
      Skill<span>Sprint</span><span class="cursor">_</span>
    </h1>

    <p class="subtitle">Admin control portal</p>

    <div id="generalError" class="error-message" role="alert" aria-live="assertive" style="color: #ff4444; margin-bottom: 1rem; text-align: center;"></div>
    <p id="adminLoginStatus" class="helper-text" role="status" aria-live="polite">Use an admin account to access the control center.</p>

    <form id="adminLoginForm">
      <div class="input-group">
        <input type="email" id="email" required autocomplete="email" />
        <label>Admin Email</label>
      </div>

      <div class="input-group password">
        <input type="password" id="password" required autocomplete="current-password" aria-describedby="adminCapsLockHint" />
        <label>Password</label>
        <span id="togglePassword">👁</span>
      </div>
      <p id="adminCapsLockHint" class="helper-text" style="display:none;">Caps Lock appears to be on.</p>

      <button type="submit" id="loginBtn">
        <span>ADMIN AUTHENTICATE</span>
        <div class="loader"></div>
      </button>
    </form>

    <p class="footer-text">
      Need an admin account?
      <a href="admin-signup.html">Create admin access</a>
    </p>

    <p class="footer-text">
      Student login?
      <a href="../../index.html">Go to student login</a>
    </p>
  </div>

  <script src="../js/api-base.js"></script>
  <script src="../js/admin-login.js"></script>
    <script src="../js/ux-foundation.js"></script>
</body>
</html>
